<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<link rel="stylesheet" type="text/css" href="webjars/bootstrap/4.3.1/css/bootstrap.min.css" />

<head>
	<meta charset="utf-8">
	<title>Ajout des Etudiants</title>
</head>

<body>
	<div th:replace="template"></div>
	<div class="container mt-5">
		<div class="card">
			<div class="card-header" th:if="${mode=='new'}"> Ajout des Produits </div>
			<div class="card-header" th:if="${mode=='edit'}">Modification des Produits </div>
			<div class="card-body">
				<form th:action="@{saveEtudiant}" method="post">
					<input hidden name="page" class="form-control" th:value="${page}" />
						<input hidden name="size" class="form-control" th:value="${size}" />
					<div class="form-group">
						<label class="control-label" hidden>ID Etudiant :</label>
						<input type="hidden" name="idEtudiant" class="form-control" th:value="${etudiant.idEtudiant}" />
					</div>
					<div class="form-group">
						<label class="control-label">Nom Etudiant :</label>
						<input type="text" name="nomEtudiant" class="form-control" th:value="${etudiant.nomEtudiant}" />
						<span th:errors=${etudiant.nomEtudiant} class="text-danger"> </span>
					</div>
					<div class="form-group">
						<label class="control-label">Prenom Etudiant :</label>
						<input type="text" name="prenomEtudiant" class="form-control"
							th:value="${etudiant.prenomEtudiant}" />
						<span th:errors=${etudiant.prenomEtudiant} class="text-danger"> </span>

					</div>
					<div class="form-group">
						<label class="control-label">Moyenne :</label>
						<input type="text" name="moyEtudiant" class="form-control" th:value="${etudiant.moyEtudiant}" />
						<span th:errors=${etudiant.moyEtudiant} class="text-danger"> </span>

					</div>
					<div class="form-group">
						<label class="control-label">date Inscription :</label>
						<input type="date" name="dateInscription" class="form-control"
							th:value="${etudiant.dateInscription}" />
						<span th:errors=${etudiant.dateInscription} class="text-danger"> </span>

					</div>
					<div class="form-group">
						<label class="control-label">Institut :</label>
						<select name="institut" class="form-control" th:value="${etudiant.institut.idInstitut}"
							th:if="${!#strings.isEmpty(etudiant.institut)}">
							<option th:each="c:${instituts}" th:if="${mode=='edit'}" th:value="${c.idInstitut}"
								th:text="${c.nomInstitut}" th:selected="${ c.idInstitut==etudiant.institut.idInstitut}">
							</option>
						</select>
						<!-- s'il s'agit d'un ajout (mode==new) ou d'une modification d'un produit ayant une catégorie null -->
						<select name="institut" class="form-control" th:if="${#strings.isEmpty(etudiant.institut)}">
							<option th:each="c:${instituts}" th:value="${c.idInstitut}" th:text="${c.nomInstitut}">
							</option>
						</select>
					</div>


					<div>
						<button type="submit" class="btn btn-primary">Valider</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</body>

</html>
