<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<link rel="stylesheet" type="text/css" href="webjars/bootstrap/4.3.1/css/bootstrap.min.css" />

<head>
	<meta charset="utf-8">
	<title>Modifier étudiant</title>
</head>

<body>
	<div th:replace="template"></div>
	<div class="container mt-5">
		<div class="card">
			<div class="card-header"> Modifier Etudiant </div>
			<div class="card-body">
				<form th:action="@{saveEtudiant}" method="post">
					<div class="form-group">
					<label class="control-label" hidden>ID Etudiant :</label>
					 <input type="hidden" name="idEtudiant" class="form-control"
					th:value="${etudiant.idEtudiant}" />
					</div>
					<div class="form-group">
						<label class="control-label">Nom Etudiant :</label>
						<input type="text" name="nomEtudiant" class="form-control" />
						<span th:errors= ${etudiant.nomEtudiant} class="text-danger"> </span>
					</div>
					<div class="form-group">
						<label class="control-label">Prenom Etudiant :</label>
						<input type="text" name="prenomEtudiant" class="form-control" />
						<span th:errors= ${etudiant.prenomEtudiant} class="text-danger"> </span>

					</div>
					<div class="form-group">
						<label class="control-label">Moyenne :</label>
						<input type="text" name="moyEtudiant" class="form-control" />
						<span th:errors= ${etudiant.moyEtudiant} class="text-danger"> </span>

					</div>
					<div class="form-group">
						<label class="control-label">date Inscription :</label>
						<input type="date" name="dateInscription" class="form-control" />
						<span th:errors= ${etudiant.dateInscription} class="text-danger"> </span>

					</div>
					<div>
						<button type="submit" class="btn btn-primary">Modifier</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</body>
</html>
